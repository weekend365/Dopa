name: dopa
description: Dopa mobile application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <3.14.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  path_provider: ^2.1.5
  dopa_domain:
    path: ../../packages/domain
  dopa_local_storage:
    path: ../../packages/local_storage
  drift_flutter: ^0.3.1
  video_player: ^2.14.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.7

dev_dependencies:
  integration_test:
    sdk: flutter
  drift: ^2.34.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  default-flavor: dev
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
  assets:
    - assets/garden/
    - assets/companion/
