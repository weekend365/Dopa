name: Validate repository contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apple-identifiers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Apple identifier contract
        shell: pwsh
        run: ./tooling/validate_apple_identifiers.ps1
