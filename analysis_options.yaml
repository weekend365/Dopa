analyzer:
  exclude:
    - "**/.dart_tool/**"
    - "**/build/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - discarded_futures
    - only_throw_errors
    - prefer_final_locals
    - sort_constructors_first
    - unawaited_futures
    - use_super_parameters
