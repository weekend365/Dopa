openapi: 3.1.0
info:
  title: Dopa optional photo diary (local development)
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8787/v1
security:
  - session: []
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
  parameters:
    jobId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{32}$' }
  schemas:
    Job:
      type: object
      additionalProperties: false
      required: [id, state, code, styleVersion]
      properties:
        id: { type: string }
        state:
          type: string
          enum: [queued, processing, succeeded, failed, uncertain, expired, cancelled, consumed]
        code: { type: [string, 'null'] }
        styleVersion: { const: dopa-gouache-v1 }
    Error:
      type: object
      properties:
        code: { type: string }
      required: [code]
      additionalProperties: false
  responses:
    error:
      description: Stable error code, no payloads or exception details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    job:
      description: Durable job state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Job' }
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Whether the server has a provider key (does not guarantee provider access)
          content:
            application/json:
              schema:
                type: object
                properties: { enabled: { type: boolean } }
  /sessions:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offsetMinutes, consentVersion]
              properties:
                offsetMinutes: { type: integer, minimum: -720, maximum: 840 }
                consentVersion: { const: photo-transfer-v1 }
      responses:
        '201':
          description: Anonymous token; store securely, never log
          content:
            application/json:
              schema:
                type: object
                properties: { token: { type: string, pattern: '^[a-f0-9]{64}$' } }
        default: { $ref: '#/components/responses/error' }
  /session:
    delete:
      responses:
        '200': { description: Session and all temporary images deleted }
        default: { $ref: '#/components/responses/error' }
  /jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/jobId'
    put:
      description: Idempotency key is the path ID. One daily slot reserved atomically. No text/URLs/metadata accepted.
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary, maxLength: 10485760 }
      responses:
        '202': { $ref: '#/components/responses/job' }
        default: { $ref: '#/components/responses/error' }
    get:
      responses:
        '200': { $ref: '#/components/responses/job' }
        default: { $ref: '#/components/responses/error' }
    delete:
      description: Idempotent tombstone; consumed daily quota remains.
      responses:
        '200': { description: Temporary photos removed }
        default: { $ref: '#/components/responses/error' }
  /jobs/{id}/image:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      responses:
        '200':
          description: Private result (Cache-Control no-store)
          content:
            image/webp:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/error' }
  /jobs/{id}/ack:
    parameters:
      - $ref: '#/components/parameters/jobId'
    post:
      description: Call only after committing result to local storage. Deletes server result bytes.
      responses:
        '200': { description: Download acknowledged }
        default: { $ref: '#/components/responses/error' }
